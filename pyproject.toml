[project]
name = "playnext"
version = "0.1.0"
description = "Context-aware Steam game recommender (NUS-ISS group project Backlog Breaker)"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.143.0",
    "numpy==2.5.3",
    "openai==3.28.0",
    "pandas==3.0.6",
    "psycopg[binary]==3.3.6",
    "pyarrow==26.0.0",
    "pydantic==2.14.0",
    "pysocks==1.7.1",
    "requests[socks]==2.34.2",
    "scipy==1.18.1",
    "uvicorn==0.54.0",
]

[tool.uv]
package = false
link-mode = "copy"
# "models" is only for offline builds and evaluations (build_desc_embeddings.py, local_rerank.py); the web service
# runs without it: uv sync --no-group models
default-groups = ["dev", "models"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
models = [
    "sentence-transformers==6.1.0",
    "torch==2.11.0",
]
