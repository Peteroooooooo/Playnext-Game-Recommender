<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Playnext</title>
<style>
:root {
  --bg: #0b0d12; --sheet: #1c1c1e;
  --fill: rgba(255, 255, 255, .08); --fill-2: rgba(255, 255, 255, .14);
  --material: rgba(255, 255, 255, .12);
  --ink: #f5f5f7; --ink-2: rgba(235, 235, 245, .7); --ink-3: rgba(235, 235, 245, .5);
  --accent: #0a84ff; --green: #30d158; --green-soft: rgba(48, 209, 88, .16); --orange: #ff9f0a; --orange-soft: rgba(255, 159, 10, .14);
  --shadow: 0 10px 30px rgba(0, 0, 0, .35); --shadow-lift: 0 22px 48px rgba(0, 0, 0, .55);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei UI", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  /* backdrop values chosen with the slider panel on 2026-10-22 */
  --bd-blur: 12px; --bd-bright: .85; --bd-sat: 1.2; --bd-top: .3; --bd-mid: .6; --bd-bottom: 1; --bd-fade: 1.7s;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
img { display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* backdrop: game hero art; cycles slowly on the home screen, follows the game you are on afterwards */
.backdrop { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.backdrop img { position: absolute; left: -10%; top: -10%; width: 120%; height: 120%; object-fit: cover;
  filter: blur(var(--bd-blur)) saturate(var(--bd-sat)) brightness(var(--bd-bright)); opacity: 0; transition: opacity var(--bd-fade) ease; }
.backdrop img.on { opacity: 1; }
.backdrop::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(11, 13, 18, var(--bd-top)), rgba(11, 13, 18, var(--bd-mid)) 50%, rgba(11, 13, 18, var(--bd-bottom)) 95%); }

.brand { position: absolute; top: 0; left: 0; right: 0; z-index: 2; max-width: 1180px; margin: 0 auto; padding: 18px 16px; font: 600 17px/1 var(--font-display); letter-spacing: -.01em; }
main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 0 16px 96px; }

/* search: centred on the home screen, moves to the top once a search runs */
.hero { min-height: 100svh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 72px 0 48px;
  transition: min-height .7s cubic-bezier(.2, .8, .2, 1), padding .7s cubic-bezier(.2, .8, .2, 1); }
.running .hero { min-height: 0; padding: 64px 0 0; }
.hero h1 { font: 700 clamp(34px, 6vw, 56px)/1.1 var(--font-display); letter-spacing: -.02em; margin: 0 0 28px; text-align: center;
  max-height: 140px; overflow: hidden; transition: opacity .4s, max-height .6s, margin .6s; }
.running .hero h1 { opacity: 0; max-height: 0; margin: 0; }
.search-wrap { position: relative; width: min(680px, 100%); }
.search { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 8px 0 20px; border-radius: 28px;
  background: var(--material); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); transition: background .2s; }
.search:focus-within { background: rgba(255, 255, 255, .18); }
.search svg { flex: none; width: 18px; height: 18px; color: var(--ink-3); }
.search input { flex: 1; min-width: 0; height: 100%; border: 0; background: transparent; font-size: 17px; outline: none; }
.search input::placeholder { color: var(--ink-3); }
.go { flex: none; width: 40px; height: 40px; border-radius: 50%; border: 0; background: #fff; color: #000; cursor: pointer; display: grid; place-items: center;
  opacity: 0; transform: scale(.8); pointer-events: none; transition: opacity .2s, transform .2s; }
.go svg { width: 18px; height: 18px; color: #000; }
.search.has-text .go { opacity: 1; transform: none; pointer-events: auto; }
.search:not(.has-text) .go { display: none; }
.search:not(.has-text) .help { margin-right: 6px; }
/* iOS-style clear button: shown while there is text or a result on screen */
.clear { flex: none; display: none; place-items: center; width: 28px; height: 28px; padding: 0; border: 0; background: none; cursor: pointer; color: rgba(235, 235, 245, .45); }
.clear svg { width: 18px; height: 18px; }
.clear:hover { color: rgba(235, 235, 245, .75); }
.search.has-text .clear, .running .search .clear { display: grid; }

.help { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 0; cursor: pointer; background: var(--fill-2); color: var(--ink-2);
  font: 600 14px/1 var(--font); transition: background .2s, color .2s; }
.help:hover { color: #fff; }
.help[aria-expanded="true"] { background: #fff; color: #000; }

/* how-to: one annotated sentence, then examples that drop into the search field */
.guide { width: min(680px, 100%); margin-top: 40px; animation: rise .35s ease both; }
.guide[hidden] { display: none; }
.anatomy { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px 4px; }
.running .anatomy { justify-content: flex-start; }
.anatomy span { display: grid; justify-items: center; gap: 8px; }
.anatomy b { font-weight: 500; font-size: 17px; padding: 0 4px 8px; border-bottom: 1.5px solid rgba(255, 255, 255, .3); }
.anatomy i { font-style: normal; font-size: 12.5px; color: var(--ink-3); }
.tries { margin: 36px 0 0; padding: 0; list-style: none; display: grid; justify-items: center; gap: 2px; }
.running .tries { justify-items: start; }
.tries button { all: unset; cursor: pointer; padding: 6px 10px; border-radius: 8px; font-size: 15px; color: var(--ink-2); transition: color .2s, background .2s; }
.tries button:hover, .tries button:focus-visible { color: #fff; background: var(--fill); }

.running .hero { align-items: flex-start; }

/* status while searching */
.status { margin-top: 22px; display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 15px; }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .2); border-top-color: #fff; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pbar { margin-top: 12px; width: min(680px, 100%); height: 3px; border-radius: 2px; background: var(--fill); overflow: hidden; }
.pbar i { display: block; height: 100%; width: 0; background: #fff; border-radius: inherit; transition: width .3s linear; }
.understood { margin-top: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 14px; color: var(--ink-2); animation: rise .4s ease both; }
.understood .lbl { color: var(--ink-3); margin-right: 4px; }
.chip { background: var(--fill); border-radius: 980px; padding: 4px 12px; color: var(--ink); }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* results */
.results { margin-top: 40px; animation: rise .5s ease both; }
.results h2, .more h3 { font: 700 24px/1.2 var(--font-display); letter-spacing: -.01em; margin: 0 0 18px; }
.shelf { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 32px 20px; }
@media (max-width: 980px) { .shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 600px) { .shelf { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 14px; } }
.game { all: unset; display: block; cursor: pointer; border-radius: 14px; }
.poster { position: relative; aspect-ratio: 2 / 3; border-radius: 14px; overflow: hidden; background: var(--fill); box-shadow: var(--shadow);
  transition: transform .4s cubic-bezier(.2, .8, .2, 1), box-shadow .4s; }
.poster img.main { width: 100%; height: 100%; object-fit: cover; }
.poster.fallback img.main { object-fit: contain; position: relative; z-index: 1; }
.poster .blur { position: absolute; inset: -20px; width: calc(100% + 40px); height: calc(100% + 40px); object-fit: cover; filter: blur(24px) saturate(1.3); display: none; }
.poster.fallback .blur { display: block; }
.peek { position: absolute; z-index: 2; left: 0; right: 0; bottom: 0; padding: 48px 12px 12px; font-size: 13px; line-height: 1.5; color: #fff;
  background: linear-gradient(to top, rgba(0, 0, 0, .82), transparent); opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; }
@media (hover: hover) {
  .game:hover .poster { transform: translateY(-6px) scale(1.03); box-shadow: var(--shadow-lift); }
  .game:hover .peek { opacity: 1; transform: none; }
}
.game:focus-visible { outline: none; }
.game:focus-visible .poster { box-shadow: 0 0 0 3px #fff, var(--shadow-lift); }
.g-name { margin: 12px 2px 0; font: 600 16px/1.3 var(--font-display); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.g-meta { margin: 4px 2px 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.badge { font-size: 12px; font-weight: 600; border-radius: 6px; padding: 1px 6px; }
.badge.good { color: var(--green); background: var(--green-soft); }
.badge.warn { color: var(--orange); background: var(--orange-soft); }

.more { margin-top: 64px; }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px 16px; }
@media (max-width: 600px) { .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; } }
.mini { all: unset; cursor: pointer; display: block; min-width: 0; border-radius: 12px; }
.mini img { width: 100%; aspect-ratio: 460 / 215; object-fit: cover; border-radius: 10px; background: var(--fill); box-shadow: var(--shadow); transition: transform .4s cubic-bezier(.2, .8, .2, 1); }
@media (hover: hover) { .mini:hover img { transform: scale(1.03); } }
.mini:focus-visible img { box-shadow: 0 0 0 3px #fff; }
.mini b { display: block; margin-top: 8px; font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini span { font-size: 13px; color: var(--ink-2); }

/* detail sheet */
dialog.sheet { border: 0; padding: 0; width: min(760px, calc(100% - 32px)); max-height: calc(100vh - 48px); border-radius: 22px; background: var(--sheet); color: var(--ink);
  box-shadow: 0 30px 90px rgba(0, 0, 0, .6); overflow: hidden; }
dialog.sheet::backdrop { background: rgba(0, 0, 0, .5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
dialog.sheet[open] { animation: pop .4s cubic-bezier(.2, .9, .25, 1.05) both; }
@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.97); } to { opacity: 1; transform: none; } }
.sheet-scroll { max-height: calc(100vh - 48px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
@media (max-width: 640px) {
  dialog.sheet { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 22px 22px 0 0; max-height: 92vh; }
  .sheet-scroll { max-height: 92vh; }
  dialog.sheet[open] { animation: up .4s cubic-bezier(.2, .9, .25, 1) both; }
  @keyframes up { from { transform: translateY(40%); opacity: .6; } to { transform: none; opacity: 1; } }
}
.s-hero { position: relative; aspect-ratio: 3.1 / 1; min-height: 150px; background: var(--sheet); overflow: hidden; }
.s-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.s-hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: -2px; height: 55%; background: linear-gradient(to top, var(--sheet) 4%, color-mix(in srgb, var(--sheet) 60%, transparent) 45%, transparent); }
.close { position: absolute; top: 12px; right: 12px; z-index: 2; width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
  background: rgba(0, 0, 0, .45); color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.close svg { width: 12px; height: 12px; }
.s-head { position: relative; margin-top: -36px; padding: 0 28px 22px; }
.s-head h2 { font: 700 30px/1.15 var(--font-display); letter-spacing: -.01em; margin: 0; }
.s-head h2:focus { outline: none; }
.s-head .sub { color: var(--ink-3); font-size: 14px; margin-top: 4px; }
.s-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { border: 0; border-radius: 980px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center;
  background: var(--accent); color: #fff; }
.btn.ghost { background: var(--fill); color: var(--ink); font-weight: 500; }
.btn.ghost:hover { background: var(--fill-2); }
.btn.ghost[aria-pressed="true"] { background: #fff; color: #000; }
.s-body { padding: 0 28px 28px; display: grid; gap: 28px; }
.sec-t { font: 600 17px/1.3 var(--font-display); margin: 0 0 10px; }
.why p { margin: 0 0 12px; font-size: 16.5px; line-height: 1.75; }
.why p:last-child { margin-bottom: 0; }
.why .wait { color: var(--ink-3); }
.caret { display: inline-block; width: 2px; height: 1.05em; vertical-align: -.16em; margin-left: 2px; background: var(--ink-2); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.why .note { font-size: 13px; color: var(--ink-3); }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.tile { background: var(--fill); border-radius: 14px; padding: 14px 16px; }
.tile .k { font-size: 12px; color: var(--ink-3); }
.tile .v { font: 600 21px/1.25 var(--font-display); margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .s { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; }
.plan { background: var(--fill); border-radius: 14px; padding: 16px 18px; display: grid; gap: 10px; }
.plan ol { margin: 0; padding-left: 20px; }
.plan p { margin: 0; }
.plan .muted { color: var(--ink-3); font-size: 13px; }
.warn-box { background: var(--orange-soft); border-radius: 14px; padding: 12px 16px; font-size: 14px; }
details.basis summary { cursor: pointer; font-size: 15px; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 6px; }
details.basis summary::-webkit-details-marker { display: none; }
details.basis summary::after { content: "›"; display: inline-block; transition: transform .2s; font-size: 18px; }
details.basis[open] summary::after { transform: rotate(90deg); }
.basis dl { margin: 14px 0 0; display: grid; gap: 12px; font-size: 14px; }
.basis dt { color: var(--ink-3); font-size: 12.5px; }
.basis dd { margin: 2px 0 0; }
.tag { display: inline-block; background: var(--fill); border-radius: 6px; padding: 1px 7px; margin: 2px 4px 2px 0; font-size: 13px; }
.s-foot { display: flex; justify-content: flex-end; }
.link { border: 0; background: none; color: var(--ink-3); cursor: pointer; padding: 4px 0; font-size: 13px; }
.link:hover { color: var(--ink-2); }

.toast { position: fixed; left: 50%; bottom: 28px; z-index: 50; transform: translateX(-50%) translateY(20px); opacity: 0; pointer-events: none;
  background: rgba(60, 60, 67, .9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 10px 18px; border-radius: 980px; font-size: 14px; transition: opacity .25s, transform .25s; }
.toast.show { opacity: 1; transform: translateX(-50%); }

.noanim *, .noanim *::before, .noanim *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>
</head>
<body>
<div class="backdrop" id="backdrop" aria-hidden="true"></div>
<div class="brand">Playnext</div>

<main>
  <section class="hero">
    <h1>下一款玩什么</h1>
    <div class="search-wrap">
      <form class="search" id="ask" role="search">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6"/><path d="m13 13 5 5"/></svg>
        <label for="q" class="sr-only">想玩什么样的游戏</label>
        <input id="q" autocomplete="off" placeholder="想玩什么样的？比如：轻松治愈的种田游戏">
        <button class="clear" type="button" id="clear" aria-label="清空，重新开始">
          <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor"/><path d="M7 7l6 6M13 7l-6 6" stroke="#2c2c30" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
        <button class="help" type="button" id="help" aria-expanded="false" aria-controls="guide" aria-label="怎么用">?</button>
        <button class="go" type="submit" aria-label="推荐">
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 16V4M4.5 9.5 10 4l5.5 5.5"/></svg>
        </button>
      </form>
    </div>
    <div class="guide" id="guide" hidden>
      <div class="anatomy">
        <span><b>我们 4 个人各自在家</b><i>几个人 · 在哪玩</i></span>
        <span><b>想玩轻松搞笑的合作游戏</b><i>想要的感觉</i></span>
        <span><b>每人不超过 100 块</b><i>预算</i></span>
      </div>
      <ul class="tries" id="tries" aria-label="示例，点一下放进搜索框"></ul>
    </div>
  </section>

  <div id="stage" aria-live="polite"></div>
</main>

<dialog class="sheet" id="sheet" aria-labelledby="s-title">
  <div class="sheet-scroll" id="sheet-body"></div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<div class="sr-only" id="announce" aria-live="polite"></div>

<!-- Mockup: replays two recorded real runs (card_redesign.data.js) with their measured timings; the reasons are
     replayed at their real arrival times and revealed at ~45 characters per second. -->
<script src="card_redesign.data.js"></script>
<script>
(() => {
  "use strict";
  const MOCK = window.MOCK;
  const CDN = (a, f) => `https://cdn.akamai.steamstatic.com/steam/apps/${a}/${f}`;
  const CPS = 45;                 // steady reveal speed, characters per second
  const $ = (s) => document.querySelector(s);

  function el(tag, attrs, ...kids) {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else n.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) n.append(k.nodeType ? k : String(k));
    return n;
  }
  const zh = (c) => c.name.split(" / ")[0];
  const en = (c) => (c.name_en && c.name_en !== zh(c) ? c.name_en : null);
  const yuan = (v) => (v == null ? "" : `¥${Number.isInteger(v) ? v : v.toFixed(1)}`);

  let toastT;
  function toast(t) {
    const n = $("#toast");
    n.textContent = t;
    n.classList.add("show");
    clearTimeout(toastT);
    toastT = setTimeout(() => n.classList.remove("show"), 1600);
  }

  let FF = 0;
  let scene = "single", run = 0, reasons = {}, T0 = null, openId = null, raf = null;

  // ---------- backdrop ----------
  let bdApp = null;
  function setBackdrop(appid) {
    if (bdApp === appid) return;
    bdApp = appid;
    const box = $("#backdrop");
    const img = new Image();
    img.alt = "";
    img.decoding = "async";
    img.addEventListener("load", () => {
      if (bdApp !== appid) return;
      // the new image fades in on top over --bd-fade; the old one stays fully visible underneath until then,
      // so the change takes exactly the fade time with no dark dip in the middle
      const old = [...box.children];
      const fade = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--bd-fade")) * 1000 || 0;
      box.append(img);
      requestAnimationFrame(() => requestAnimationFrame(() => img.classList.add("on")));
      setTimeout(() => old.forEach((o) => o.remove()), fade + 100);
    });
    img.addEventListener("error", () => { if (!img.dataset.fb) { img.dataset.fb = "1"; img.src = CDN(appid, "header.jpg"); } });
    img.src = CDN(appid, "library_hero.jpg");
  }

  // home screen: slowly cycle through games until the first search
  const HOME = [...MOCK.single.picks, ...MOCK.group.picks].map((c) => c.appid);
  let homeI = 0, homeT = null;
  function cycleHome() {
    setBackdrop(HOME[homeI % HOME.length]);
    homeI += 1;
    homeT = setTimeout(cycleHome, 7000);
  }
  function stopHome() { clearTimeout(homeT); homeT = null; }

  // ---------- search box ----------
  const q = $("#q"), form = $("#ask"), guide = $("#guide"), help = $("#help");
  const syncText = () => form.classList.toggle("has-text", q.value.trim().length > 0);
  q.addEventListener("input", syncText);

  // × : drop everything and go back to the home screen to describe again
  function reset() {
    clearRun();
    document.body.classList.remove("running");
    q.value = "";
    syncText();
    showGuide(false);
    scrollTo({ top: 0, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    if (!homeT) cycleHome();
    q.focus();
  }
  $("#clear").addEventListener("click", reset);

  // "?" shows how to phrase a request; an example only fills the field, the user still presses Enter
  const showGuide = (on) => { guide.hidden = !on; help.setAttribute("aria-expanded", String(on)); };
  help.addEventListener("click", () => showGuide(guide.hidden));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !guide.hidden) { showGuide(false); help.focus(); } });
  const TRIES = [MOCK.single.text, MOCK.group.text, "像《星露谷物语》那样的，但别太肝"];
  $("#tries").append(...TRIES.map((text) => el("li", {}, el("button", { type: "button",
    onclick: () => { q.value = text; syncText(); showGuide(false); q.focus(); } }, text))));

  // the mockup only has two recorded runs: a request that mentions playing together replays the group one
  const isGroup = (t) => /([2-9两二三四五六七八九十几]\s*个?人|我们|一起|朋友|合作|联机|对战)/.test(t);
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (!q.value.trim()) return;
    showGuide(false);
    FF = 0;
    go(isGroup(q.value) ? "group" : "single");
  });

  // ---------- one run ----------
  function clearRun() {
    run += 1;
    reasons = {};
    T0 = null;
    if (raf) cancelAnimationFrame(raf);
    raf = null;
    $("#stage").replaceChildren();
    if ($("#sheet").open) $("#sheet").close();
  }

  function stepsFor(s) {
    const t = s.timings;
    const steps = [["正在理解你的需求", t.understand || 4], ["正在挑选", Math.min((t.scoring || 0) + (t.hard_filter || 0), 0.8)]];
    if (t.rerank) steps.push(["正在按你的描述排序", t.rerank]);
    steps.push(["正在查实时价格", (t.ranking_and_live_prices || 1) + (t.cards || 0)]);
    return steps;
  }

  function understoodChips(u) {
    const out = [u.party_size > 1 ? `${u.party_size} 个人` : "一个人"];
    const SET = { online: "各自在家", local: "同屏", remote: "远程同乐", hybrid: "部分在一起" };
    (u.setups || []).forEach((k) => SET[k] && out.push(SET[k]));
    if (u.interaction === "coop" && u.party_size > 1) out.push("合作");
    if (u.budget && u.budget.amount) out.push(`${u.budget.scope === "per_person" ? "每人" : "合计"} ¥${u.budget.amount} 以内`);
    if (u.seeds?.length) out.push(`像《${u.seeds.join("》《")}》`);
    (u.feel_want || []).forEach((x) => out.push(x));
    (u.mechanics || []).forEach((x) => out.push(x));
    if (u.feel_avoid?.length) out.push(`不要${u.feel_avoid.join("、")}`);
    return [...new Set(out)];
  }

  const understoodRow = (s) => el("div", { class: "understood" }, el("span", { class: "lbl" }, "我理解成"),
    understoodChips(s.understood).map((c) => el("span", { class: "chip" }, c)));

  function go(sc) {
    scene = sc;
    stopHome();
    document.body.classList.add("running");
    clearRun();
    const me = run, s = MOCK[scene];
    const steps = stepsFor(s);
    let acc = 0;
    const ends = steps.map(([, d]) => (acc += d)), total = acc;
    const label = el("span", {}, steps[0][0]);
    const bar = el("i", {});
    $("#stage").append(el("div", { class: "status", role: "status" }, el("span", { class: "spin", "aria-hidden": "true" }), label),
      el("div", { class: "pbar", "aria-hidden": "true" }, bar));
    const t0 = performance.now();
    const tick = () => {
      if (me !== run || T0) return;
      const e = (performance.now() - t0) / 1000;
      const i = ends.findIndex((x) => e < x);
      label.textContent = steps[i === -1 ? steps.length - 1 : i][0];
      bar.style.width = `${Math.min(e / total, 1) * 100}%`;
      if (e >= ends[0] && !$("#stage .understood")) {
        $("#stage .status").before(understoodRow(s));
      }
      if (e >= total) showResults(me);
      else requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }

  // ---------- reasons: written in the background, kept per card ----------
  function arrived(r, t) {
    let n = 0;
    for (const [mt, len] of r.marks) if (mt <= t) n = len;
    return Math.min(n, r.text.length);
  }
  function stateOf(r, t) {
    const complete = r.marks.length && t >= r.marks[r.marks.length - 1][0];
    return complete && r.shown >= r.text.length ? "done" : arrived(r, t) > 0 ? "writing" : "waiting";
  }
  function initReasons(s) {
    for (const c of s.picks) {
      const r = c.long_reason || { text: "", marks: [], ok: false };
      const first = r.marks.length ? r.marks[0][0] : 0;
      const o = { text: r.text, marks: r.marks, ok: r.ok, shown: 0, state: "waiting", fallback: c.reason };
      if (FF) o.shown = Math.min(Math.max(0, CPS * (FF - first)), arrived(o, FF));
      o.state = stateOf(o, FF);
      reasons[c.appid] = o;
    }
  }
  let last = 0;
  function loop(now) {
    const dt = last ? Math.min((now - last) / 1000, .1) : 0;
    last = now;
    const t = (performance.now() - T0) / 1000;
    let busy = false;
    for (const [id, r] of Object.entries(reasons)) {
      if (r.state === "done") continue;
      const got = arrived(r, t);
      r.shown = Math.min(got, r.shown + (CPS + Math.max(0, got - r.shown - 150) * 0.6) * dt);
      r.state = stateOf(r, t);
      if (r.state !== "done") busy = true;
      else if (openId === +id) $("#announce").textContent = "推荐理由已写完";
      if (openId === +id) renderWhy(+id);
    }
    raf = busy ? requestAnimationFrame(loop) : null;
  }

  // ---------- results ----------
  function posterImg(appid) {
    const box = el("div", { class: "poster" });
    const blur = el("img", { class: "blur", alt: "", src: CDN(appid, "header.jpg") });
    const img = el("img", { class: "main", alt: "", decoding: "async", src: CDN(appid, "library_600x900.jpg") });
    img.addEventListener("error", () => { if (!box.classList.contains("fallback")) { box.classList.add("fallback"); img.src = CDN(appid, "header.jpg"); } });
    box.append(blur, img);
    return box;
  }

  function metaLine(c, group) {
    const p = c.price || {}, bits = [];
    const price = p.free ? "免费" : p.final != null ? yuan(p.final) : null;
    if (group && c.setup) {
      if (price) bits.push(el("span", {}, p.free ? price : `每人 ${price}`));
      bits.push(el("span", {}, `· ${c.setup.kind_zh} ${c.setup.max_players ?? "?"} 人`));
    } else if (price) bits.push(el("span", {}, price));
    if (p.discount_pct) bits.push(el("span", { class: "badge good" }, `-${p.discount_pct}%`));
    else if (p.near_low) bits.push(el("span", { class: "badge good" }, "接近史低"));
    if (c.unknown?.length || c.rating?.below_floor) bits.push(el("span", { class: "badge warn" }, c.unknown?.length ? "待确认" : "褒贬不一"));
    return bits;
  }

  function showResults(me) {
    if (me !== run || T0) return;
    const s = MOCK[scene], group = scene === "group";
    T0 = performance.now() - FF * 1000;
    initReasons(s);
    if (!$("#stage .understood")) $("#stage").prepend(understoodRow(s));
    $("#stage .status")?.remove();
    $("#stage .pbar")?.remove();
    const cards = s.picks.map((c, i) => {
      const poster = posterImg(c.appid);
      poster.append(el("div", { class: "peek", "aria-hidden": "true" },
        [(c.core_tags_zh || []).slice(0, 3).join(" · "), c.rating?.pct_positive != null ? `${c.rating.pct_positive}% 好评` : null].filter(Boolean).join("　")));
      return el("button", { type: "button", class: "game", "aria-label": `${zh(c)}，打开详情`,
        onclick: () => openSheet(c, i), onmouseenter: () => setBackdrop(c.appid), onfocus: () => setBackdrop(c.appid) },
        poster, el("div", { class: "g-name" }, zh(c)), el("div", { class: "g-meta" }, metaLine(c, group)));
    });
    $("#stage").append(el("section", { class: "results", "aria-labelledby": "res-t" },
      el("h2", { id: "res-t" }, group ? `适合你们 ${s.understood.party_size} 个人的 ${s.picks.length} 款` : `为你挑了 ${s.picks.length} 款`),
      el("div", { class: "shelf" }, cards)));
    setBackdrop(s.picks[0].appid);
    if (s.backups?.length) {
      $("#stage").append(el("section", { class: "more", "aria-labelledby": "more-t" }, el("h3", { id: "more-t" }, "还可以看看"),
        el("div", { class: "strip" }, s.backups.map((b) => el("button", { type: "button", class: "mini",
          onclick: () => openBackup(b), onmouseenter: () => setBackdrop(b.appid), onfocus: () => setBackdrop(b.appid) },
          el("img", { src: CDN(b.appid, "header.jpg"), alt: "", decoding: "async" }),
          el("b", {}, b.name.split(" / ")[0]),
          el("span", {}, b.price?.free ? "免费" : yuan(b.price?.final)))))));
    }
    last = 0;
    raf = requestAnimationFrame(loop);
  }

  // ---------- detail sheet ----------
  const X = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>';
  function heroBlock(appid, name) {
    const img = el("img", { src: CDN(appid, "library_hero.jpg"), alt: "", decoding: "async" });
    img.addEventListener("error", () => { if (!img.dataset.fb) { img.dataset.fb = "1"; img.src = CDN(appid, "header.jpg"); } });
    const close = el("button", { type: "button", class: "close", "aria-label": `关闭《${name}》`, onclick: () => $("#sheet").close() });
    close.innerHTML = X;
    return el("div", { class: "s-hero" }, img, close);
  }
  function headBlock(title, sub, actions) {
    return el("div", { class: "s-head" }, el("h2", { id: "s-title", tabindex: "-1" }, title), sub ? el("div", { class: "sub" }, sub) : null,
      el("div", { class: "s-actions" }, actions));
  }
  function toggleBtn(label) {
    const b = el("button", { type: "button", class: "btn ghost", "aria-pressed": "false" }, label);
    b.addEventListener("click", () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on); if (on) toast(`已记下：${label}`); });
    return b;
  }
  const storeBtn = (url) => el("a", { class: "btn", href: url, target: "_blank", rel: "noopener noreferrer" }, "在 Steam 查看");

  function renderWhy(id) {
    const box = document.getElementById("why-text"), r = reasons[id];
    if (!box || !r) return;
    box.setAttribute("aria-busy", r.state !== "done");
    if (r.state === "waiting") {
      if (!box.querySelector(".wait")) box.replaceChildren(el("p", { class: "wait" }, "正在写", el("span", { class: "caret", "aria-hidden": "true" })));
      return;
    }
    const text = r.ok ? r.text : r.fallback;
    const shown = r.ok ? text.slice(0, Math.floor(r.shown)) : text;
    const nodes = shown.split(/\n\s*\n/).map((t) => t.trim()).filter(Boolean).map((t) => el("p", {}, t));
    if (r.state !== "done" && nodes.length) nodes[nodes.length - 1].append(el("span", { class: "caret", "aria-hidden": "true" }));
    if (!r.ok && r.state === "done") nodes.push(el("p", { class: "note" }, "这段按游戏数据生成。"));
    box.replaceChildren(...nodes);
  }

  const tile = (k, v, s) => el("div", { class: "tile" }, el("div", { class: "k" }, k), el("div", { class: "v" }, v), s ? el("div", { class: "s" }, s) : null);

  function openSheet(c) {
    const group = scene === "group", p = c.price || {}, like = c.like || {};
    openId = c.appid;
    setBackdrop(c.appid);
    const sub = [en(c), c.year, c.developer].filter(Boolean).join(" · ");
    const actions = [storeBtn(c.store_url), toggleBtn("喜欢"), toggleBtn("不喜欢"), toggleBtn("玩过了"), toggleBtn("不感兴趣")];

    const tiles = [];
    tiles.push(p.free ? tile("价格", "免费") : tile(group ? "每人价格" : "价格", yuan(p.final),
      [p.discount_pct ? `${(100 - p.discount_pct) / 10} 折` : null, p.low != null ? `史低 ${yuan(p.low)}` : null].filter(Boolean).join(" · ")));
    if (c.rating?.pct_positive != null) tiles.push(tile("Steam 好评", `${c.rating.pct_positive}%`, `${c.rating.reviews.toLocaleString("zh-CN")} 篇评测`));
    if (c.time_to_beat) tiles.push(tile("通关时长", c.time_to_beat.replace(/^.*?(\d)/, "$1").split("（")[0]));
    if (group && c.setup) tiles.push(tile("怎么玩", c.setup.kind_zh, `最多 ${c.setup.max_players ?? "?"} 人`));
    else if (c.library) tiles.push(tile("你的库", c.library));

    const blocks = [
      el("section", { class: "why" }, el("h3", { class: "sec-t" }, "为什么推荐给你"), el("div", { id: "why-text", "aria-busy": "true" })),
      el("div", { class: "tiles" }, tiles),
    ];
    if (group && c.setup) {
      blocks.push(el("section", {}, el("h3", { class: "sec-t" }, "怎么开局"),
        el("div", { class: "plan" },
          el("ol", {}, c.setup.steps.map((t) => el("li", {}, t))),
          c.setup.purchase ? el("p", {}, c.setup.purchase) : null,
          c.setup.controller ? el("p", { class: "muted" }, `手柄：${c.setup.controller}`) : null)));
    }
    const warns = [];
    if (like.feel_bad?.length) warns.push(`带有你不想要的：${like.feel_bad.join("、")}`);
    (c.unknown || []).forEach((w) => warns.push(`待确认：${w}`));
    if (c.mechanics_note) warns.push(c.mechanics_note);
    if (warns.length) blocks.push(el("div", { class: "warn-box" }, warns.join("；")));

    const basis = [];
    if (c.colike) basis.push(["同好", c.colike.text]);
    if (like.shared_core_tags?.length) basis.push([like.anchor ? `和《${like.anchor}》共有的核心标签` : "核心标签", like.shared_core_tags.map((t) => el("span", { class: "tag" }, t))]);
    if (c.diff && (c.diff.more.length || c.diff.less.length)) basis.push([`和《${c.diff.anchor}》比`, [c.diff.more.length ? `多了：${c.diff.more.join("、")}` : "", c.diff.less.length ? `　少了：${c.diff.less.join("、")}` : ""].join("")]);
    if (c.lineage_path?.text) basis.push(["关系链", c.lineage_path.text]);
    if (like.quote) basis.push(["商店介绍原句", `“${like.quote}”`]);
    if (c.rating?.text) basis.push(["口碑", c.rating.text]);
    if (p.text) basis.push(["价格明细", `${p.text}${p.as_of ? `（${p.as_of}）` : ""}`]);
    if (basis.length) blocks.push(el("details", { class: "basis" }, el("summary", {}, "推荐依据"),
      el("dl", {}, basis.map(([k, v]) => el("div", {}, el("dt", {}, k), el("dd", {}, v))))));
    blocks.push(el("div", { class: "s-foot" }, el("button", { type: "button", class: "link", onclick: () => toast("已记下，我们会核对") }, "信息有误？")));

    $("#sheet-body").replaceChildren(heroBlock(c.appid, zh(c)), headBlock(zh(c), sub, actions), el("div", { class: "s-body" }, blocks));
    $("#sheet-body").scrollTop = 0;
    renderWhy(c.appid);
    showSheet();
  }

  function openBackup(b) {
    openId = null;
    setBackdrop(b.appid);
    const p = b.price || {}, name = b.name.split(" / ")[0];
    const tiles = [p.free ? tile("价格", "免费") : tile("价格", yuan(p.final), p.low != null ? `史低 ${yuan(p.low)}` : null)];
    if (b.pct_positive != null) tiles.push(tile("Steam 好评", `${b.pct_positive}%`));
    $("#sheet-body").replaceChildren(heroBlock(b.appid, name),
      headBlock(name, b.label || null, [storeBtn(`https://store.steampowered.com/app/${b.appid}/`), toggleBtn("喜欢"), toggleBtn("玩过了")]),
      el("div", { class: "s-body" }, el("div", { class: "tiles" }, tiles)));
    showSheet();
  }

  function showSheet() {
    $("#sheet").showModal();
    $("#s-title").focus({ preventScroll: true });
  }
  $("#sheet").addEventListener("close", () => { openId = null; });
  $("#sheet").addEventListener("click", (e) => { if (e.target === $("#sheet")) $("#sheet").close(); });

  // ---------- start ----------
  // test hooks: ?scene=group&skip&t=5&open=0&noanim (results at once, reasons as if 5 s passed, open card 0)
  const qs = new URLSearchParams(location.search);
  if (qs.has("noanim")) document.documentElement.classList.add("noanim");
  FF = Number(qs.get("t")) || 0;
  if (qs.has("skip") || FF) {
    const sc = qs.get("scene") === "group" ? "group" : "single";
    q.value = MOCK[sc].text;
    syncText();
    go(sc);
    showResults(run);
    if (qs.has("open")) openSheet(MOCK[sc].picks[Number(qs.get("open")) || 0]);
  } else {
    cycleHome();
    if (qs.has("help")) showGuide(true);
  }
})();
</script>
</body>
</html>
