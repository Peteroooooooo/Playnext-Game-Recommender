<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Playnext</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
<style>
/* Layout: one calm column. Ask box on top, the conditions the system understood as editable chips, then evidence cards. Group mode adds a party panel. */
:root {
  --bg: #F3F4F7;
  --surface: #FFFFFF;
  --surface-2: #EDEFF4;
  --ink: #14161D;
  --ink-2: #4A5061;
  --ink-3: #737A8C;
  --line: #E0E3EA;
  --accent: #2F52F5;
  --accent-ink: #FFFFFF;
  --accent-soft: #E7ECFF;
  --accent-line: #C2CEFF;
  --good: #0F7556;
  --good-soft: #DDF2E9;
  --warn: #935600;
  --warn-soft: #FFF0D2;
  --bad: #B3372A;
  --bad-soft: #FBE5E1;
  --m1: #2F52F5; --m2: #0B8F73; --m3: #D2543A; --m4: #8150D0; --m5: #B57B00; --m6: #3D7FA8;
  --av-ink: #FFFFFF;
  --shadow: 0 1px 2px rgba(20, 22, 29, .05), 0 6px 18px rgba(20, 22, 29, .05);
  --font-display: "Bricolage Grotesque", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-data: "Geist Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F14; --surface: #161921; --surface-2: #1F2331; --ink: #ECEEF4; --ink-2: #A8AEBE; --ink-3: #80879A; --line: #282D3A;
    --accent: #7E95FF; --accent-ink: #0B0D12; --accent-soft: #1C2447; --accent-line: #35417C;
    --good: #4FC79B; --good-soft: #0F2A20; --warn: #F0B45A; --warn-soft: #2D2210; --bad: #FF8272; --bad-soft: #34181A;
    --m1: #6E86FF; --m2: #2DC2A0; --m3: #F07A5C; --m4: #A97DF0; --m5: #E1A82A; --m6: #5EA8D6;
    --av-ink: #0B0D12;
    --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F14; --surface: #161921; --surface-2: #1F2331; --ink: #ECEEF4; --ink-2: #A8AEBE; --ink-3: #80879A; --line: #282D3A;
  --accent: #7E95FF; --accent-ink: #0B0D12; --accent-soft: #1C2447; --accent-line: #35417C;
  --good: #4FC79B; --good-soft: #0F2A20; --warn: #F0B45A; --warn-soft: #2D2210; --bad: #FF8272; --bad-soft: #34181A;
  --m1: #6E86FF; --m2: #2DC2A0; --m3: #F07A5C; --m4: #A97DF0; --m5: #E1A82A; --m6: #5EA8D6;
  --av-ink: #0B0D12;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 20px; }
.muted { color: var(--ink-3); }
.mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

/* Top bar */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30;
  background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: saturate(1.3) blur(12px);
  -webkit-backdrop-filter: saturate(1.3) blur(12px);
}
.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
.brand b { font-family: var(--font-display); font-weight: 700; font-size: 19px; letter-spacing: -.01em; }
.brand small { font-size: 13px; color: var(--ink-3); }
.top-actions { display: flex; align-items: center; gap: 8px; }
.region { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); }
.region select {
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 8px 5px 12px; font-size: 13px; color: var(--ink); cursor: pointer;
}
.pop-wrap { position: relative; }
.steam-btn {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 4px 12px 4px 4px; font-size: 13px; cursor: pointer;
}
.steam-btn.off { padding: 6px 14px; }
.pop {
  position: absolute; right: 0; top: calc(100% + 8px); z-index: 40;
  width: min(320px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
  padding: 16px; display: grid; gap: 10px; font-size: 14px;
}
.pop p { margin: 0; color: var(--ink-2); }
.pop .note { font-size: 12.5px; color: var(--ink-3); }

/* Avatars */
.av {
  width: 28px; height: 28px; border-radius: 50%; flex: none;
  display: grid; place-items: center;
  background: var(--h, var(--m1)); color: var(--av-ink);
  font-size: 13px; font-weight: 600; line-height: 1;
}
.av.sm { width: 22px; height: 22px; font-size: 11px; }

/* Ask */
.ask { padding-block: 40px 4px; display: grid; gap: 18px; }
.ask h1 {
  margin: 0; font-size: clamp(30px, 5vw, 42px); line-height: 1.15; font-weight: 700;
  letter-spacing: -.02em; text-wrap: balance;
}
.lede { margin: 0; color: var(--ink-2); font-size: 16px; max-width: 34em; }
.seg { display: inline-flex; flex-wrap: wrap; padding: 4px; background: var(--surface-2); border-radius: 999px; gap: 2px; justify-self: start; }
.seg button {
  border: 0; background: transparent; color: var(--ink-2); font-size: 14px; font-weight: 500;
  padding: 7px 16px; border-radius: 999px; cursor: pointer; transition: background .15s, color .15s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.composer {
  display: flex; gap: 10px; align-items: flex-end;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 10px 10px 10px 18px; box-shadow: var(--shadow);
  transition: border-color .15s, box-shadow .15s;
}
.composer:focus-within { border-color: var(--accent-line); box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow); }
.composer textarea {
  flex: 1; min-width: 0; border: 0; outline: 0; resize: none; background: transparent;
  font-size: 17px; line-height: 1.55; padding-block: 8px; min-height: 60px;
}
.composer textarea::placeholder { color: var(--ink-3); }
.send {
  flex: none; display: inline-flex; align-items: center; gap: 6px;
  background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 12px;
  padding: 10px 18px; font-weight: 600; cursor: pointer; transition: filter .15s, transform .1s;
}
.send:hover { filter: brightness(1.08); }
.send:active { transform: translateY(1px); }
.examples { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.examples > span { font-size: 13px; color: var(--ink-3); }
.ex {
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
  border-radius: 999px; padding: 5px 12px; font-size: 13.5px; cursor: pointer; text-align: left;
}
.ex:hover { border-color: var(--ink-3); color: var(--ink); }

/* Understood conditions */
.conds { padding-block: 22px 0; display: grid; gap: 10px; }
.label-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.eyebrow { font-size: 13px; font-weight: 500; color: var(--ink-3); letter-spacing: .04em; }
.hint { font-size: 12.5px; color: var(--ink-3); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 4px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px;
  padding: 4px 4px 4px 12px; font-size: 14px;
}
.chip.fixed { background: var(--accent-soft); border-color: var(--accent-line); padding-right: 12px; }
.chip .x {
  width: 24px; height: 24px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-3);
  display: grid; place-items: center; cursor: pointer;
}
.chip .x:hover { background: var(--surface-2); color: var(--ink); }
.add { border: 1px dashed var(--ink-3); background: transparent; color: var(--ink-2); border-radius: 999px; padding: 4px 12px; font-size: 14px; cursor: pointer; }
.add:hover { color: var(--ink); border-color: var(--ink-2); }
.menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 25; min-width: 210px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 6px; display: grid;
}
.menu button { text-align: left; border: 0; background: transparent; font-size: 14px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.menu button:hover:not(:disabled) { background: var(--surface-2); }
.menu button:disabled { color: var(--ink-3); cursor: default; }
.notice { font-size: 13px; color: var(--warn); background: var(--warn-soft); border-radius: 10px; padding: 8px 12px; justify-self: start; }

/* Party */
.party {
  margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 18px; display: grid; gap: 16px;
}
.party-row { display: grid; gap: 10px; }
.party-row > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.party h2 { margin: 0; font-size: 15px; font-weight: 600; }
.members { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.member {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 4px 4px 4px;
  border-radius: 999px; background: var(--surface-2); font-size: 14px;
}
.member .who { display: grid; line-height: 1.2; padding-right: 6px; }
.member .who small { font-size: 11.5px; color: var(--ink-3); }
.member .x { width: 24px; height: 24px; border-radius: 50%; border: 0; background: transparent; color: var(--ink-3); display: grid; place-items: center; cursor: pointer; }
.member .x:hover { background: var(--surface); color: var(--ink); }
.add-member { display: inline-flex; gap: 6px; align-items: center; }
.add-member input {
  width: 120px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 14px;
}
.place-help { margin: 0; font-size: 13px; color: var(--ink-3); }

/* Results */
.results { padding-block: 30px 8px; display: grid; gap: 16px; transition: opacity .18s; }
.results.refresh { opacity: .45; }
.res-head { display: grid; gap: 6px; }
.res-head h2 { margin: 0; font-size: 22px; letter-spacing: -.01em; text-wrap: balance; }
.funnel { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-family: var(--font-data); font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.funnel b { color: var(--ink); font-weight: 600; }
.cards { display: grid; gap: 14px; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px;
  display: grid; grid-template-columns: 176px minmax(0, 1fr); gap: 20px;
  animation: rise .35s ease both;
}
@keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
.cover {
  position: relative; overflow: hidden; align-self: start;
  aspect-ratio: 460 / 215; max-width: 100%; border-radius: 10px;
  background: linear-gradient(135deg, var(--c1), var(--c2));
  display: flex; align-items: flex-end; padding: 10px 12px; color: #FFFFFF;
}
.cover::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 90% at 85% 0%, rgba(255, 255, 255, .26), transparent 55%); }
.cover span { position: relative; z-index: 1; font-family: var(--font-display); font-weight: 700; font-size: 16px; line-height: 1.1; letter-spacing: -.01em; text-shadow: 0 1px 8px rgba(0, 0, 0, .3); }
.cover em { position: absolute; z-index: 1; top: 8px; left: 10px; font-style: normal; font-family: var(--font-data); font-size: 11px; background: rgba(0, 0, 0, .38); color: #FFFFFF; padding: 1px 7px; border-radius: 999px; }
.card-main { display: grid; gap: 12px; min-width: 0; align-content: start; }
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
.card-top h3 { margin: 0; font-family: var(--font-display); font-size: 21px; line-height: 1.2; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.card-top .meta { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.fit { flex: none; text-align: right; display: grid; justify-items: end; gap: 2px; }
.fit .num { font-family: var(--font-data); font-size: 26px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.fit .lbl { font-size: 12px; color: var(--ink-3); }
.fit .bar { width: 72px; height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.fit .bar i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.reason { margin: 0; color: var(--ink-2); max-width: 44em; }
.mode-row { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.facts { margin: 0; display: grid; gap: 6px; }
.facts > div { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.facts dt { font-size: 13px; color: var(--ink-3); }
.facts dd { margin: 0; font-size: 14px; }
.tag { display: inline-block; font-size: 12.5px; line-height: 1.6; padding: 0 8px; border-radius: 6px; background: var(--accent-soft); margin: 0 4px 4px 0; }
.tag.dim { background: var(--surface-2); color: var(--ink-2); }
.kind { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; margin-left: 6px; white-space: nowrap; }
.who-fit { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mfit { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px 2px 2px; border-radius: 999px; background: var(--surface-2); font-family: var(--font-data); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.mfit.low { background: var(--warn-soft); color: var(--warn); }
.mfit.none { color: var(--ink-3); }
.plan {
  background: var(--surface-2); border-radius: 14px; padding: 14px 16px;
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px;
}
.plan h4 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: var(--ink-3); }
.plan ol { margin: 0; padding-left: 1.3em; display: grid; gap: 3px; font-size: 14px; }
.pay { display: grid; gap: 3px; font-size: 14px; }
.pay > div { display: flex; justify-content: space-between; gap: 10px; }
.pay .own { color: var(--good); }
.pay .total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; font-weight: 600; }
.card-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 13.5px; color: var(--ink-2); }
.price .now { font-family: var(--font-data); font-size: 18px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.off { font-family: var(--font-data); font-size: 12px; font-weight: 600; color: var(--good); background: var(--good-soft); border-radius: 6px; padding: 0 6px; }
.was { font-family: var(--font-data); text-decoration: line-through; color: var(--ink-3); }
.pill { display: inline-block; font-size: 12px; line-height: 1.7; border-radius: 999px; padding: 0 9px; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--ink-2); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.link {
  display: inline-flex; align-items: center; gap: 5px; font-size: 13.5px; color: var(--ink-2); text-decoration: none;
  padding: 6px 10px; border-radius: 8px; border: 0; background: transparent; cursor: pointer;
}
.link:hover { background: var(--surface-2); color: var(--ink); }
.src { font-size: 12px; color: var(--ink-3); margin: 0; }
.more { justify-self: center; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 8px 18px; font-size: 14px; cursor: pointer; }
.more:hover { color: var(--ink); border-color: var(--ink-3); }

.sub-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-top: 8px; }
.sub-head h3 { margin: 0; font-size: 16px; }
.pend {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; align-items: start;
}
.pend h4 { margin: 0; font-size: 15px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.pend p { margin: 0; font-size: 13.5px; color: var(--ink-2); grid-column: 1 / -1; }
.failed { border: 1px solid var(--line); border-radius: 14px; padding: 0 16px; background: transparent; }
.failed summary { cursor: pointer; padding: 12px 0; font-size: 14px; color: var(--ink-2); }
.fail-row { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 12px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.fail-row .why { display: flex; flex-wrap: wrap; gap: 6px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: grid; gap: 14px; }
.panel h3 { margin: 0; font-size: 18px; text-wrap: balance; }
.panel p { margin: 0; color: var(--ink-2); }
.fix {
  display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left;
  border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; cursor: pointer;
}
.fix:hover { border-color: var(--accent-line); }
.fix b { font-family: var(--font-data); font-weight: 600; color: var(--accent); white-space: nowrap; }
.step { display: flex; align-items: center; gap: 10px; color: var(--ink-3); font-size: 14px; }
.step .dot { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; flex: none; }
.step.done { color: var(--ink); }
.step.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.step.now { color: var(--ink); }
.step.now .dot { border-color: var(--accent); animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 4px var(--accent-soft); } }

.foot { margin-top: 36px; padding-block: 20px 48px; border-top: 1px solid var(--line); display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-3); }
.foot p { margin: 0; max-width: 60em; }

@media (max-width: 680px) {
  .brand small, .steam-btn .lbl-long { display: none; }
  .ask { padding-block: 26px 0; }
  .card { grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 16px; }
  .cover { aspect-ratio: 460 / 160; }
  .plan { grid-template-columns: minmax(0, 1fr); }
  .send .lbl { display: none; }
  .send { padding: 10px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Playnext 首页">
      <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="8" fill="var(--accent)"/><path d="M8 8.5v11l7-5.5z" fill="var(--accent-ink)"/><path d="M15 8.5v11l7-5.5z" fill="var(--accent-ink)" opacity=".5"/></svg>
      <b>Playnext</b><small>下一款玩什么</small>
    </a>
    <div class="top-actions">
      <label class="region" for="region"><span>商店区</span>
        <select id="region"><option value="CN">CN · ¥</option><option value="US">US · $</option></select>
      </label>
      <div class="pop-wrap" id="steam"></div>
    </div>
  </div>
</header>

<main class="wrap" id="top">
  <section class="ask" id="ask"></section>
  <section class="conds" id="conds" aria-live="polite"></section>
  <section id="party"></section>

function priceOf(id, region) { return G(id).price[region] || null; }
function fmtNum(v) { return Number.isInteger(v) ? String(v) : String(Math.round(v * 100) / 100); }
function money(v, region = state.region) {

}
function wan(n) { return n >= 10000 ? `${(n / 10000).toFixed(1).replace(/\.0$/, "")} 万` : n.toLocaleString("zh-CN"); }
function owns(m, id, s) {
  if (m.id === "me") return s.connected && id in MY_LIB;
  return (m.own || []).includes(id);

function quality(id) {
  const g = G(id);
  const pos = g.reviews * g.pct / 100;
  return (pos + ALPHA) / (g.reviews + ALPHA + BETA);
}
function priceScore(id, s) {
  const p = priceOf(id, s.region);
  if (!p || p.final == null || p.low == null) return 0.5;
  if (p.final === 0) return 1;
  const r = p.final / p.low;
  if (r <= 1.05) return 1;
  if (r >= 2) return 0;
  return (2 - r) / 0.95;
}
function lowStatus(p) {
  if (!p || p.final == null || p.final === 0) return null;
  if (p.low == null) return { cls: "neutral", text: "史低未知" };
  const r = p.final / p.low;
  if (r <= 1.0001) return { cls: "good", text: "已是史低" };
  if (r <= 1.05) return { cls: "good", text: "接近史低" };
  return { cls: "neutral", text: `比史低高 ${Math.round((r - 1) * 100)}%` };
}

  };

  if (budgetOnly.length) {
    const need = Math.min(...budgetOnly.map((f) => f.rs[0].need));
    tryFix(`预算提到${s.scenario === "group" ? "每人 " : ""}${money(need, s.region)}`, (t) => { t.budget = need; });
  }
  if (s.scenario === "group") {
    if (s.place !== "online") tryFix("改成大家各自在家、在线联机", (t) => { t.place = "online"; });
    if (s.members.length > 2) {
      const last = s.members[s.members.length - 1];
      tryFix(`少 1 个人（${last.name}这次不参加）`, (t) => { t.members = t.members.slice(0, -1); });
    }

const CN_NUM = { 两: 2, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8 };
function applyText(text) {
  const t = text.trim();
  const notes = [];
  const isGroup = /(\d+|[两二三四五六七八几])\s*个?\s*人|一起|朋友|联机|开黑|同屏|客厅/.test(t);
  state.conds = new Set();
  state.dismissed = new Set();
  state.k = SHOW;
  if (isGroup) {
    if (state.mode !== "group") notes.push("听起来是几个人一起玩，已切到「和朋友一起」。");
    state.mode = "group";
    state.scenario = "group";
    const mNum = t.match(/(\d+|[两二三四五六七八])\s*个?\s*人/);
    let n = mNum ? (CN_NUM[mNum[1]] || parseInt(mNum[1], 10)) : 5;
    n = Math.max(2, Math.min(8, n || 5));
    const base = MEMBERS0.slice(0, Math.min(n, MEMBERS0.length));
    for (let i = base.length; i < n; i++) base.push({ id: `g${i}`, name: `朋友${i + 1}`, hue: (i % 6) + 1 });
    state.members = base;
    state.place = /同屏|客厅|一台|沙发|电视/.test(t) ? "local" : "online";
  } else {
    state.mode = "solo";
    const mech = /(肉鸽|rogue|类\s*rogue)/i.test(t) && /(基地|经营|建造|营地|殖民)/.test(t);
    state.scenario = mech ? "mech" : "seed";
    if (!mech && !/(哈迪斯|hades)/i.test(t)) notes.push("原型里只准备了《Hades》这一组示例数据，先用它演示。");
  }
  const mB = t.match(/[¥￥$]\s*(\d+)|(\d+)\s*(?:块|元|刀)/);
  if (mB) {
    state.conds.add("budget");
    state.budget = parseInt(mB[1] || mB[2], 10);
    if (/\$|刀/.test(mB[0]) !== (state.region === "US")) {
      state.conds.delete("budget");
      notes.push(`预算的币种和当前商店区（${state.region}）不一致，先没加预算。`);
    }
  }
  if (/(不要|别|怕|不玩|不想).{0,6}恐怖/.test(t)) state.conds.add("noHorror");
  if (/史低/.test(t)) state.conds.add("nearLow");
  state.note = notes.join(" ");
}

  const host = owner ? owner.m : state.members[0];
  const steps = local
    ? [`用${host.name}的电脑打开游戏`,"同屏多人通常每人需要一个手柄，支持情况以游戏说明为准", "分屏还是同屏、怎么分配角色，以游戏内设置为准"]
    : [`${host.name}打开游戏并建房`, `用 Steam 好友邀请其他 ${n - 1} 人`, "房间设置和中途加入以游戏内说明为准"];
  const payRows = local
    ? (x.pay[0].own
      ? `<div><span>一台电脑一份</span><span class="own">${esc(x.pay[0].m.name)}已有</span></div>`
      : `<div><span>一台电脑一份，${esc(x.pay[0].m.name)}来买</span><span class="mono">${money(x.pay[0].cost)}</span></div>`)
    : x.pay.map((p) => `<div><span>${esc(p.m.name)}</span>${p.own ? `<span class="own">已有</span>` : `<span class="mono">${money(p.cost)}</span>`}</div>`).join("");
  return `<article class="card">
    ${coverHtml(x.id, i)}
    <div class="card-main">
      <div class="card-top">${titleHtml(g)}${fitHtml(x.rel, "大家的契合度")}</div>
      <div class="mode-row"><span class="pill accent">${esc(capText)}</span>${x.cap ? `<span class="hint">人数来源：${esc(x.cap.src)}</span>` : ""}</div>
      <p class="reason">${esc(x.e.reason)}</p>
      <dl class="facts">
        <div><dt>每个人</dt><dd><div class="who-fit">${fits}</div></dd></div>
        <div><dt>口碑</dt><dd><span class="mono">${g.pct}%</span> 好评 · ${wan(g.reviews)} 条评价<span class="kind">玩家评价</span></dd></div>
      </dl>
      <div class="plan">
        <div><h4>怎么开局</h4><ol>${steps.map((s) => `<li>${esc(s)}</li>`).join("")}</ol></div>
        <div><h4>谁买谁免</h4><div class="pay">${payRows}<div class="total"><span>团队新增</span><span class="mono">${x.total == null ? "价格未知" : money(x.total)}</span></div></div></div>
      </div>
      <p class="src">来源：模式 Steam 官方分类 · 人数 ${esc(x.cap ? x.cap.src : "—")} · 价格 Steam 商店 / IsThereAnyDeal · 取数 2026-10</p>
      <div class="card-foot">
        ${priceHtml(x.id)}
        <div class="actions">${storeLink(x.id)}<button class="link" data-dismiss="${x.id}">换掉这款</button></div>
      </div>
    </div>
  </article>`;
}

function pendingHtml(list) {
  if (!list.length) return "";
  const n = state.members.length;
  return `<div class="sub-head"><h3>待确认</h3><span class="hint">缺一项事实，不放进推荐，买之前请自己确认</span></div>
    ${list.map((x) => {
      const g = G(x.id);
      return `<div class="pend">
        <h4>${esc(g.zh || g.name)} <span class="pill warn">${esc(x.unk)}</span></h4>
        ${priceHtml(x.id)}
        <p>Steam 标着支持${state.place === "local" ? "同屏" : "在线"}合作，但能不能 ${n} 个人一起玩，数据源里没有准确数字。去商店页或游戏说明确认一下。</p>
      </div>`;
    }).join("")}`;
}
function failedHtml(list) {
  if (!list.length) return "";
  return `<details class="failed"><summary>没通过的 ${list.length} 款，看看为什么</summary>
    ${list.map((f) => {
      const g = G(f.e.id);
      return `<div class="fail-row"><span>${esc(g.zh || g.name)}</span><span class="why">${f.rs.map((r) => `<span class="pill ${r.k === "budget" ? "warn" : "bad"}">${esc(r.t)}</span>`).join("")}</span></div>`;
    }).join("")}
  </details>`;
}

const STEPS = ["理解你的要求", "检查能不能玩", "找候选游戏", "排序", "写推荐理由"];
function renderResults() {
  const el = $("#results");
  if (state.loading >= 0) {
    el.innerHTML = `<div class="panel" role="status"><h3>正在挑选</h3>${STEPS.map((s, i) => `<div class="step ${i < state.loading ? "done" : i === state.loading ? "now" : ""}"><span class="dot">${i < state.loading ? I.check : ""}</span>${s}</div>`).join("")}</div>`;
    return;
  }
  const res = evaluate(state);
  const group = state.scenario === "group";
  const n = state.members.length;
  let head;
  if (group) head = state.place === "local" ? `适合 ${n} 个人同屏玩` : state.place === "mixed" ? `适合你们 ${n} 个人混合开局` : `适合你们 ${n} 个人一起玩`;
  else head = state.scenario === "mech" ? "肉鸽和基地经营都是核心玩法的游戏" : "像《Hades》的下一款";
  const shown = res.ok.slice(0, state.k);
  const funnel = `<div class="funnel"><span>示例候选 <b>${res.poolSize}</b> 款</span><span aria-hidden="true">→</span><span>符合条件 <b>${res.ok.length}</b></span>${group ? `<span aria-hidden="true">·</span><span>待确认 <b>${res.pending.length}</b></span>` : ""}<span aria-hidden="true">→</span><span>推荐 <b>${shown.length}</b></span></div>`;
  let body;
  if (!res.ok.length) {
    const fixes = suggestions(state, res);
    state._fixes = fixes;
    body = `<div class="panel">
      <h3>按现在的条件，没有${group ? "能开局" : "合适"}的游戏</h3>
      <p>${group ? "人数、开局方式和预算一起卡住了。" : "预算把候选都排除了。"}${fixes.length ? "改下面任意一条就有得选，内容雷区不会被放宽：" : "可以去掉一些条件再试。"}</p>
      ${fixes.map((f, i) => `<button class="fix" data-fix="${i}"><span>${esc(f.label)}</span><b>${f.count} 款可以玩</b></button>`).join("")}
    </div>`;
  } else {
    body = `<div class="cards">${shown.map((x, i) => group ? groupCard(x, i) : soloCard(x, i)).join("")}</div>
      ${res.ok.length > shown.length ? `<button class="more" data-act="more">再看 ${Math.min(2, res.ok.length - shown.length)} 款</button>` : ""}`;
  }
  el.innerHTML = `<div class="res-head"><h2>${esc(head)}</h2>${funnel}</div>${body}${group ? pendingHtml(res.pending) : ""}${failedHtml(res.failed)}`;
}

function renderAll() { renderSteam(); renderConds(); renderParty(); renderResults(); }
function refresh() {
  state.menu = false;
  renderConds();
  renderParty();
  const el = $("#results");
  if (reduceMotion) { renderResults(); return; }
  el.classList.add("refresh");
  setTimeout(() => { renderResults(); el.classList.remove("refresh"); }, 160);
}
function run() {
  state.menu = false;
  renderAsk();
  renderConds();
  renderParty();
  if (reduceMotion) { state.loading = -1; renderResults(); return; }
  state.loading = 0;
  renderResults();
  const tick = () => {
    state.loading += 1;
    if (state.loading >= STEPS.length) { state.loading = -1; renderResults(); return; }
    renderResults();
    setTimeout(tick, 220);
  };
  setTimeout(tick, 220);
}

/* ---------- events ---------- */
document.addEventListener("click", (ev) => {
  const t = ev.target.closest("button, a");
  if (!t) {
    if (state.menu || state.steamPop) {
      if (!ev.target.closest(".pop, .menu")) { state.menu = false; state.steamPop = false; renderConds(); renderSteam(); }
    }
    return;
  }
  const d = t.dataset;
  if (d.mode) {
    if (d.mode === state.mode) return;
    state.text = EXAMPLES[d.mode][0].text;
    applyText(state.text);
    state.note = "";
    run();
    return;
  }
  if (d.ex != null) {
    state.text = EXAMPLES[state.mode][+d.ex].text;
    applyText(state.text);
    run();
    return;
  }
  if (d.rm) { state.conds.delete(d.rm); state.note = ""; refresh(); return; }
  if (d.add) {
    state.conds.add(d.add);
    if (d.add === "budget") state.budget = BUDGET[state.scenario === "group" ? "group" : "solo"][state.region];
    refresh();
    return;
  }
  if (d.rmMember) { state.members = state.members.filter((m) => m.id !== d.rmMember); refresh(); return; }
  if (d.place) { state.place = d.place; refresh(); return; }
  if (d.dismiss) { state.dismissed.add(+d.dismiss); refresh(); return; }
  if (d.fix != null) {
    const f = state._fixes && state._fixes[+d.fix];
    if (f) { f.mod(state); state.note = `已按建议调整：${f.label}`; refresh(); }
    return;
  }
  switch (d.act) {
    case "menu": state.menu = !state.menu; state.steamPop = false; renderConds(); renderSteam(); break;
    case "more": state.k += 2; renderResults(); break;
    case "add-member": state.addingMember = true; renderParty(); $("#new-member")?.focus(); break;
    case "steam": state.steamPop = !state.steamPop; state.menu = false; renderSteam(); renderConds(); if (state.steamPop) $("#steam-url")?.focus(); break;
    case "steam-off": state.connected = false; state.steamPop = false; renderAll(); break;
  }
});

document.addEventListener("submit", (ev) => {
  ev.preventDefault();
  const f = ev.target.dataset.form;
  if (f === "ask") {
    const v = $("#q").value.trim();
    if (!v) { $("#q").focus(); return; }
    state.text = v;
    applyText(v);
    run();
  } else if (f === "member") {
    const v = $("#new-member").value.trim();
    state.addingMember = false;
    if (v) {
      const used = new Set(state.members.map((m) => m.hue));
      const hue = [1, 2, 3, 4, 5, 6].find((h) => !used.has(h)) || 6;
      state.members.push({ id: `g${Date.now()}`, name: v, hue });
    }
    refresh();
  } else if (f === "steam") {
    state.connected = true;
    state.steamPop = false;
    renderAll();
  }
});

document.addEventListener("keydown", (ev) => {
  if (ev.target.id === "q" && ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    ev.target.form.requestSubmit();
  }
  if (ev.key === "Escape" && (state.menu || state.steamPop || state.addingMember)) {
    state.menu = false; state.steamPop = false; state.addingMember = false;
    renderAll();
  }
});

$("#region").addEventListener("change", (ev) => {
  state.region = ev.target.value;
  if (state.conds.has("budget")) {
    state.conds.delete("budget");
    state.note = "预算按商店区的币种设置，切换商店区后已移除，需要的话重新加一条。";
  } else state.note = "";
  refresh();
});

applyText(state.text);
state.note = "";
renderAsk();
renderAll();
</script>
</body>
</html>
